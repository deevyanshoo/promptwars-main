<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Daywell helps you read a notice, check cautions, and follow a plan in Hindi or English."
    />
    <title>Daywell</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main" data-i18n="skip"></a>
    <header class="wrap header">
      <a class="brand" href="/" data-i18n-label="home">Daywell</a>
      <nav data-i18n-label="understand">
        <button
          id="input-nav"
          data-i18n="understand"
          aria-current="location"
        ></button
        ><button id="day-nav" data-i18n="my_day"></button>
      </nav>
      <div class="preferences">
        <div class="languages" role="group" data-i18n-label="language">
          <button id="language-hi" lang="hi" aria-pressed="true">हिन्दी</button
          ><span aria-hidden="true">|</span
          ><button id="language-en" lang="en" aria-pressed="false">
            English
          </button>
        </div>
        <button
          id="text-toggle"
          aria-pressed="false"
          data-i18n="larger"
        ></button>
      </div>
    </header>
    <main id="main" class="wrap" tabindex="-1">
      <div class="page-heading">
        <h1 data-i18n="heading"></h1>
        <p data-i18n="intro"></p>
      </div>
      <p id="storage-warning" class="notice warning" role="alert" hidden></p>
      <div class="app-grid">
        <section
          id="input-workspace"
          class="workspace"
          aria-labelledby="input-title"
        >
          <h2
            id="input-title"
            class="sr-only"
            data-i18n="understand"
            tabindex="-1"
          ></h2>
          <div class="input-modes" role="group" data-i18n-label="understand">
            <button
              id="photo-mode"
              data-i18n="photo_tab"
              aria-pressed="true"
            ></button
            ><button
              id="text-mode"
              data-i18n="text_tab"
              aria-pressed="false"
            ></button
            ><button
              id="fraud-mode"
              data-i18n="fraud_tab"
              aria-pressed="false"
            ></button>
          </div>
          <p id="fraud-hint" class="notice" data-i18n="fraud_hint" hidden></p>
          <div id="photo-panel">
            <h2 class="panel-title" data-i18n="photo_heading"></h2>
            <p class="muted" data-i18n="photo_hint"></p>
            <div class="photo-picker">
              <div>
                <label
                  class="button"
                  for="photo-file"
                  data-i18n="choose_photo"
                ></label
                ><input
                  id="photo-file"
                  class="file-input"
                  type="file"
                  accept="image/jpeg,image/png,image/webp"
                /><label
                  class="button"
                  for="camera-file"
                  data-i18n="camera_photo"
                ></label
                ><input
                  id="camera-file"
                  class="file-input"
                  type="file"
                  accept="image/jpeg,image/png,image/webp"
                  capture="environment"
                />
              </div>
              <img
                id="photo-preview"
                data-i18n-label="photo_alt"
                alt=""
                hidden
              />
            </div>
            <div id="photo-actions" hidden>
              <button
                id="discard-photo"
                class="text-action"
                data-i18n="discard_photo"
              ></button>
              <p class="privacy" data-i18n="photo_privacy"></p>
              <button
                id="extract-button"
                class="primary"
                data-i18n="extract"
              ></button>
            </div>
            <p id="photo-status" role="status" hidden></p>
            <div id="photo-error" class="notice warning" role="alert" hidden>
              <p></p>
              <button id="extract-retry" data-i18n="retry"></button>
            </div>
          </div>
          <form id="message-form" novalidate hidden>
            <div id="review-note" class="notice" hidden>
              <h2 data-i18n="review_heading"></h2>
              <p data-i18n="review_hint"></p>
              <p id="readability"></p>
              <ul id="uncertainties"></ul>
            </div>
            <div class="form-heading">
              <label for="message" data-i18n="message_label"></label>
              <div class="actions">
                <button
                  id="voice-input"
                  type="button"
                  data-i18n="speak"
                ></button
                ><button
                  id="voice-stop"
                  type="button"
                  data-i18n="stop_dictation"
                  hidden
                ></button>
              </div>
            </div>
            <p class="muted" data-i18n="message_hint"></p>
            <textarea
              id="message"
              rows="5"
              maxlength="4000"
              data-i18n-placeholder="message_placeholder"
              aria-describedby="message-privacy"
            ></textarea>
            <p id="character-count" class="counter">0 / 4,000</p>
            <p id="voice-status" role="status" hidden></p>
            <p class="small muted" data-i18n="voice_notice"></p>
            <label id="review-control" class="check-row" hidden
              ><input id="review-confirm" type="checkbox" /><span
                data-i18n="review_confirm"
              ></span
            ></label>
            <p id="message-privacy" class="privacy" data-i18n="privacy"></p>
            <button
              id="understand-button"
              class="primary"
              type="submit"
              data-i18n="explain"
            ></button>
            <p id="request-status" role="status" hidden></p>
            <div id="request-error" class="notice warning" role="alert" hidden>
              <p></p>
              <button type="button" id="retry" data-i18n="retry"></button>
            </div>
          </form>
          <details class="examples">
            <summary data-i18n="synthetic"></summary>
            <div class="actions">
              <button
                id="ordinary-example"
                data-i18n="ordinary_example"
              ></button
              ><button
                id="suspicious-example"
                data-i18n="suspicious_example"
              ></button>
            </div>
          </details>
          <section id="result" aria-labelledby="result-heading" hidden>
            <div class="result-heading">
              <h2
                id="result-heading"
                tabindex="-1"
                data-i18n="result_heading"
              ></h2>
              <div class="actions">
                <button id="listen-plan" data-i18n="listen"></button
                ><button id="stop-reading" data-i18n="stop_reading"></button>
              </div>
            </div>
            <p id="speech-status" role="status" hidden></p>
            <div id="plan-overview"></div>
            <div id="guide" hidden></div>
            <p id="plan-status" role="status" hidden></p>
            <p class="small muted" data-i18n="advisory"></p>
          </section>
          <details id="execution-details" hidden>
            <summary data-i18n="how"></summary>
            <p class="small muted" data-i18n="how_hint"></p>
            <div id="execution-list"></div>
          </details>
        </section>
        <aside id="day-panel" aria-labelledby="day-heading">
          <h2 id="day-heading" tabindex="-1" data-i18n="my_day"></h2>
          <p id="today" class="muted"></p>
          <p id="day-counts"></p>
          <p id="next-action" class="notice"></p>
          <div id="saved-plans"></div>
          <div id="task-list"></div>
          <form id="manual-form" novalidate>
            <h3 data-i18n="manual_title"></h3>
            <label for="task-title" data-i18n="task_label"></label
            ><input
              id="task-title"
              maxlength="280"
              data-i18n-placeholder="task_placeholder"
            /><label for="task-date" data-i18n="due_label"></label
            ><input
              id="task-date"
              type="date"
              min="1900-01-01"
              max="2100-12-31"
            /><button class="primary" data-i18n="add_task"></button>
          </form>
          <p id="task-status" role="status" hidden></p>
          <p class="small muted" data-i18n="storage_notice"></p>
          <button
            id="clear-data"
            class="text-action"
            data-i18n="clear"
          ></button>
          <div id="clear-confirm" class="notice warning" hidden>
            <p data-i18n="clear_question"></p>
            <div class="actions">
              <button id="confirm-clear" data-i18n="confirm_clear"></button
              ><button id="cancel-clear" data-i18n="cancel"></button>
            </div>
          </div>
        </aside>
      </div>
      <noscript
        ><p>
          Please enable JavaScript. Daywell चलाने के लिए JavaScript चालू करें।
        </p></noscript
      >
    </main>
    <footer class="wrap">
      <strong>Daywell</strong>
      <p data-i18n="footer"></p>
    </footer>
  </body>
</html>
